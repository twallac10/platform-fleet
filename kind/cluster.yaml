# One config for every tier cluster: `kind create cluster --name tier-<tier> --config kind/cluster.yaml`.
# Single node to keep 3 clusters on one laptop. Node image pinned to the
# default of kind v0.31.0.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    kubeadmConfigPatches:
      # etcd in memory: kind nodes mount /tmp as tmpfs. With three clusters on
      # one Docker Desktop disk, etcd's fsyncs stalled the API server and every
      # leader-elected component restarted together, over and over. The cost:
      # cluster state does not survive a Docker restart (rebuild with task up).
      - |
        kind: ClusterConfiguration
        etcd:
          local:
            dataDir: /tmp/etcd
