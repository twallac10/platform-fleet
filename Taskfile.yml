# platform-fleet tasks. `task --list` for the overview.
# Tier and app lists always come from tiers.yaml / apps.yaml.
version: "3"

vars:
  # Folder with every repo checked out side by side (default: parent of this repo).
  WORKSPACE: '{{.WORKSPACE | default (printf "%s/.." .ROOT_DIR)}}'

env:
  WORKSPACE: "{{.WORKSPACE}}"

tasks:
  default:
    cmds: [task --list]
    silent: true

  tools:
    desc: Check required CLIs are installed
    silent: true
    cmds:
      - |
        missing=0
        for t in docker kind kubectl flux helm gh jq yq kustomize kubeconform go python3 rsync; do
          command -v $t >/dev/null || { echo "missing: $t"; missing=1; }
        done
        yq --version 2>/dev/null | grep -q mikefarah || { echo "wrong yq: need mikefarah/yq v4"; missing=1; }
        [ $missing -eq 0 ] && echo "all tools found"
        exit $missing

  # --- repos ---------------------------------------------------------------
  repos:create:
    desc: Create the template, app, fleet and promoter repos on GitHub (app repos from the template) and push the workspace
    cmds: [./scripts/repos.sh create]

  repos:push:
    desc: Push every workspace folder to main of its GitHub repo
    cmds: [./scripts/repos.sh push]

  repos:shape:
    desc: Check every app repo still matches the template's shape
    cmds: [./scripts/repos.sh shape]

  charts:seed:
    desc: "Bootstrap only: mirror all charts to GHCR and point every tier at them"
    cmds: [./scripts/seed-charts.sh]

  # --- config --------------------------------------------------------------
  fleet:render:
    desc: Regenerate clusters/<tier>/ and fleet/ from tiers.yaml and apps.yaml
    cmds: [./scripts/render.sh]

  lint:
    desc: Static checks for the fleet and every app repo (no cluster needed)
    cmds:
      - ./scripts/render.sh
      - git diff --exit-code -- clusters fleet || (echo "fleet/ or clusters/ is stale; commit the output of task fleet:render" && exit 1)
      - ./scripts/repos.sh shape
      - ./scripts/lint-fleet.sh
      - ./scripts/validate-apps.sh

  # --- clusters ------------------------------------------------------------
  up:
    desc: Create a kind cluster per tier and bootstrap Flux (needs GITHUB_TOKEN for flux bootstrap)
    cmds: [./scripts/up.sh]

  down:
    desc: Delete every tier's kind cluster
    cmds: [./scripts/down.sh]

  status:
    desc: Flux status per tier, then the latest gate Deployment per app per tier
    cmds: [./scripts/status.sh]

  grafana:
    desc: "Open a tier's Grafana: task grafana -- dev"
    cmds: ["./scripts/grafana.sh {{.CLI_ARGS}}"]

  # --- promotion (later phases) ---------------------------------------------
  promoter:build:
    desc: Build the promoter CLI from the platform-promoter checkout
    dir: "{{.WORKSPACE}}/platform-promoter"
    sources: ["**/*.go", go.mod, go.sum]
    generates: [bin/promoter]
    cmds: [go build -o bin/promoter ./cmd/promoter]

  check:
    desc: "Run the evidence gate and record a Deployment: task check -- --app kyverno --tier dev [--no-record]"
    deps: [promoter:build]
    cmds: ['"{{.WORKSPACE}}/platform-promoter/bin/promoter" check --fleet "{{.ROOT_DIR}}" {{.CLI_ARGS}}']

  promote:
    desc: "Gate the source tier, then open the next tier's PR: task promote -- --app kyverno --from dev"
    deps: [promoter:build]
    cmds: ['"{{.WORKSPACE}}/platform-promoter/bin/promoter" promote --fleet "{{.ROOT_DIR}}" {{.CLI_ARGS}}']
  gh:envs:
    desc: "Environments per tier, branch protection, auto-merge, label and PROMOTER_TOKEN secret in every app repo"
    cmds: [./scripts/gh-envs.sh]
  # --- demo scenarios (after task up; run task demo:reset between them) ---
  demo:good:
    desc: "kube-prometheus-stack version bump flows tier by tier to a prd PR awaiting approval (DEMO_KPS_VERSION, default 93.1.0)"
    cmds: [./scripts/demo/good.sh]
  demo:ready-but-broken:
    desc: "A values change drops the canary scrape target: HelmRelease Ready, gate blocks it in the first tier"
    cmds: [./scripts/demo/ready-but-broken.sh]
  demo:sneaky:
    desc: "A promotion PR that also flips validationFailureAction is rejected by CI"
    cmds: [./scripts/demo/sneaky.sh]
  demo:reset:
    desc: "Restore every repo to the workspace baseline and close open promotion/demo PRs"
    cmds: [./scripts/demo/reset.sh]
